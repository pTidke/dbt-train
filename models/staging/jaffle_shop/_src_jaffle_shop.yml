version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      loaded_at_field: _etl_loaded_at
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 12
          period: hour
    tables:
      - name: customers
        config:
          freshness: null
      - name: orders

  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment